[network_details]
description = A description file for FNO2d network

[network_params_details]
network_modes = Fourier transform modes
network_width = Hidden channel size
stacks_num = Number of stacked layers
pad_on = Whether to pad
padding = Percentage of padding to the domain when input is non-periodic
mlp_on = Whether to add a MLP layer after each spectral layer
normalization_on = Whether to add normalization before and after spectral layer
mlp_first = Whether to use MLP instead of nn.Linear as the first layer
mlp_last = Whether to use MLP instead of nn.Linear as the last layer
fact_on = Whether to use factorisation
fact = The factorisation to use

[network_parameters]
network_modes = 12
network_width = 20
stacks_num = 4
pad_on = 1
padding = 0.01
mlp_on = 0
normalization_on = 1
mlp_first = 0
mlp_last = 0
fact_on = 0
fact = tucker
